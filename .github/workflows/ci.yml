# =====================================================================
# Integracion continua de PhishShield Bolivia
# Corre en cada push y en cada pull request:
#   - backend: pruebas con Maven (sin contextLoads, que necesita PostgreSQL)
#     y reporte de cobertura de JaCoCo como artefacto
#   - frontend: pruebas con Vitest y build de produccion
#   - ia: pruebas con pytest (las del servicio se omiten solas si falta
#     el modelo entrenado, que no esta en git)
# Ningun paso necesita contrasenas ni claves: no hay secretos en este archivo.
# =====================================================================
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Pruebas (sin contextLoads) y cobertura
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dtest='*Test' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas (Vitest)
        run: npm test -- --watch=false
      - name: Build de produccion
        run: npm run build

  ia:
    name: Modelo de IA (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ia/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas (pytest)
        run: python -m pytest -q
