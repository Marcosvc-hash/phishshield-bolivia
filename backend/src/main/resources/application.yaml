spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/phishshield
    username: phishshield
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  