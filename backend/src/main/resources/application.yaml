spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/phishshield
    username: phishshield
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

phishshield:
  ia:
    # Servicio de prediccion (ia/servicio.py). Si no responde, el analisis
    # sigue solo con las reglas.
    url: ${IA_URL:http://localhost:8000}
    timeout: 2s
    habilitada: ${IA_HABILITADA:true}
