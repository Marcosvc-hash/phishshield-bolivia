spring:
  application:
    name: backend
  datasource:
    # Sin DB_URL se usa la base real. Para la demo del Centro de Pruebas QA:
    # DB_URL=jdbc:postgresql://localhost:5432/phishshield_qa
    # (lo hace herramientas/levantar-backend-qa.ps1)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/phishshield}
    username: phishshield
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

phishshield:
  ia:
    # Servicio de prediccion (ia/servicio.py). Si no responde, el analisis
    # sigue solo con las reglas.
    url: ${IA_URL:http://localhost:8000}
    timeout: 2s
    habilitada: ${IA_HABILITADA:true}
  jwt:
    # Clave HMAC para firmar los tokens: minimo 32 caracteres. Nunca en git;
    # se pasa como variable de entorno (en IntelliJ: Run > Edit Configurations).
    secreto: ${JWT_SECRET}
    duracion-acceso: 15m
    duracion-refresco: 7d
  qa:
    # Centro de Pruebas QA (/admin/qa). Sin QA_BASE_URL, QA_TEST_USER o
    # QA_TEST_PASSWORD los casos que los necesitan quedan NOT_RUN con el motivo.
    # La contrasena nunca se escribe en la evidencia ni en el log.
    base-url: ${QA_BASE_URL:}
    frontend-url: ${QA_FRONTEND_URL:}
    usuario: ${QA_TEST_USER:}
    contrasena: ${QA_TEST_PASSWORD:}
    # Evidencias y reportes de cada ejecucion (ignorada por git)
    carpeta-evidencias: ${QA_EVIDENCIAS_DIR:qa-evidencias}
    ambiente: ${QA_AMBIENTE:local}
    # Las pruebas crean datos: solo corren contra una base *_qa o prueba_*
    permitir-base-real: ${QA_PERMITIR_BASE_REAL:false}
    # Envio de los reportes por correo (opcional). Sin MAIL_HOST, MAIL_PORT,
    # MAIL_USERNAME y MAIL_PASSWORD el envio se omite (estado no_configurado).
    correo:
      host: ${MAIL_HOST:}
      puerto: ${MAIL_PORT:}
      usuario: ${MAIL_USERNAME:}
      contrasena: ${MAIL_PASSWORD:}
      remitente: ${MAIL_FROM:}
      starttls: ${MAIL_STARTTLS:true}
    # Asistente de IA (opcional, Claude). Sin ANTHROPIC_API_KEY la pantalla
    # oculta sus funciones. Nunca decide PASS ni FAIL.
    asistente:
      clave: ${ANTHROPIC_API_KEY:}
      modelo: ${QA_IA_MODELO:claude-opus-5-5}
      url: ${QA_IA_API_URL:https://api.anthropic.com}
